name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Already published version to finalize
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'push'
    permissions:
      contents: write
      id-token: write
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - name: Check the tag names the version being released
        # The registry will not accept a replacement for a version already
        # published, so a tag that does not match package.json either publishes
        # something nobody asked for or fails after the release is already cut.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not name package.json version $version." >&2
            exit 1
          fi
      - name: Create ZIP archive
        run: |
          cd dist
          zip ../turbowarp-extension.zip *.js
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.js
            turbowarp-extension.zip
      - name: Use an npm that can publish without a stored token
        # Trusted publishing needs npm 11.5.1 or newer, and Node 22 ships 10.
        run: npm install -g npm@11.21.0
      - name: Publish to npm
        # No token in this repository. The package's trusted publisher on
        # npmjs.com names this repository and this workflow, and npm checks that
        # instead; the credential it issues lives for the length of the job.
        # Provenance is attached without asking.
        #
        # Publishing follows validation, so a failed check or a mismatched tag stops the release
        # before anything reaches the registry, where it cannot be taken back.
        run: npm publish --access public
      - name: Complete release and verify latest and next
        run: node scripts/finalize-release-tags.ts "$(node -p 'require("./package.json").name')" "$(node -p 'require("./package.json").version')"

  finalize-existing:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global npm@11.21.0
      - name: Verify version and complete published release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node -e "if (require('./package.json').version !== process.env.RELEASE_VERSION) throw Error('Version differs from main');"
          node scripts/finalize-release-tags.ts @kubohiroya/turbowarp-camera-calibration "$RELEASE_VERSION"
