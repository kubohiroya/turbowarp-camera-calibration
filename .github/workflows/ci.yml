name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      # The only check that starts a browser, and the only one that can see
      # whether the pinned OpenCV build provides what the backend calls. Its
      # functions are registered by the WebAssembly module at run time, so they
      # are in no source file, and the module does not finish initializing under
      # Node. Kept out of `pnpm check` so a local run needs no browser; kept
      # here so a dependency bump cannot pass review without it.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run opencv:check
      # The drawing and the detector are one repository now, which removes the
      # drift between them but not the question: a board can be drawn wrongly
      # without anyone noticing, because the mistake looks like a camera that
      # cannot see.
      - run: pnpm run board:check
